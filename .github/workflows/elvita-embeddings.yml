name: Elvita embedding checks

on:
  push:
    branches: [feat/elvita-embeddings]
  pull_request:
    paths:
      - 'features/elvita.py'
      - 'notebooks/elvita/**'
      - 'common.py'
      - 'tests/test_elvita.py'
      - 'requirements-elvita.txt'
      - '.github/workflows/elvita-embeddings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-elvita.txt
      - name: Install embedding dependencies
        run: python -m pip install -r requirements-elvita.txt
      - name: Require DuckDB and run all embedding tests
        run: |
          python -c "import duckdb; print('DuckDB', duckdb.__version__)"
          python -m unittest discover -s tests -p 'test_elvita.py' -v
